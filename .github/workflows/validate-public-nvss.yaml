name: Validate Public NVSS vs CDC WONDER

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  validate-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - name: Cache NCHS public-use mortality files
        uses: actions/cache@v4
        with:
          path: validation/cache
          key: nchs-public-nvss-1990-2000-2010-2020-2024-v1

      - name: Run public NVSS vs CDC WONDER validation
        run: Rscript validation/validate_public_nvss.R

      - name: Upload mismatch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wonder-validation-mismatches
          path: validation/results/
